function economy(balls,runs,bpo){return balls?(runs/(balls/(bpo||6))).toFixed(2):'0.00'}
function canContinue(m){

  const limit=Math.max(1,Number(m.overs)||1)*Math.max(1,Number(m.ballsPerOver)||6);
  if((Number(inn.balls)||0)>=limit)return false;

function previousOverBowler(m,inn){

function wicketLimit(inn){const count=activePlayers(getTeam(inn.battingTeamId)).length;return count?Math.min(10,Math.max(1,count-1)):10}
function checkMaiden(m,inn){
 if(!inn.balls||inn.balls%m.ballsPerOver!==0)return;
 const over=Math.floor(inn.balls/m.ballsPerOver)-1;
 const events=inn.events.filter(e=>Number(String(e.over||'0.0').split('.')[0])===over);
 const last=[...events].reverse().find(e=>e.legal);
 if(!last||!last.bowlerId)return;
 const bowlerEvents=events.filter(e=>e.bowlerId===last.bowlerId);
 if(bowlerEvents.filter(e=>e.legal).length!==m.ballsPerOver)return;
 if(bowlerEvents.some(e=>(Number(e.bowlerRuns)||0)>0))return;
 const bowler=inn.bowlers[last.bowlerId];
 if(bowler)bowler.maidens=(bowler.maidens||0)+1
}
function finishMatch(m){
 const last=m.innings[m.innings.length-1],first=m.innings[0];
 m.status='completed';m.completedAt=new Date().toISOString();db.currentMatchId=null;tab='score';
 const name=id=>getTeam(id)?getTeam(id).name:'Team';
 if(last.target&&last.total>=last.target){m.result=name(last.battingTeamId)+' won by '+Math.max(0,wicketLimit(last)-last.wickets)+' wickets';return}
 if(m.format!=='Test'){
  const par=last.target?last.target-1:first.total,margin=par-last.total;
  m.result=margin===0?'Match tied':name(first.battingTeamId)+' won by '+Math.max(0,margin)+' runs';return
 }
 const aTotal=(Number(m.innings[0]?.total)||0)+(Number(m.innings[2]?.total)||0);
 const bTotal=(Number(m.innings[1]?.total)||0)+(Number(m.innings[3]?.total)||0);
 if(last.wickets>=wicketLimit(last)||last.declared){
  m.result=aTotal===bTotal?'Match tied':aTotal>bTotal?name(m.teamA)+' won by '+(aTotal-bTotal)+' runs':name(m.teamB)+' won by '+Math.max(0,wicketLimit(last)-last.wickets)+' wickets'
 }else m.result='Match drawn'
}
function afterDelivery(m,inn){
 const lastEvent=inn.events[inn.events.length-1];
 if(lastEvent&&lastEvent.legal)checkMaiden(m,inn);
 if(inn.wickets>=wicketLimit(inn))inn.complete=true;
 if(m.format!=='Test'&&inn.balls>=m.overs*m.ballsPerOver)inn.complete=true;
 if(inn.target&&inn.total>=inn.target){inn.complete=true;finishMatch(m);return}
 const lastIndex=m.format==='Test'?3:1;
 if(inn.complete&&m.currentInnings>=lastIndex&&m.innings.length>lastIndex)finishMatch(m)
}

function playerStatsCard(p){const s=metrics(p.id);return'<section class="panel"><div class="panelhead"><div><div class="scoreteam"><i class="colorball" style="background:'+esc(color(p.teamId))+'"></i><div><h2>'+esc(p.name)+'</h2><div class="sub">'+esc(p.teamName)+' · Jersey '+esc(p.jersey||'—')+'</div></div></div></div><span class="badge">'+esc(roleFor(getTeam(p.teamId),p.id)||'PLAYER')+'</span></div><div class="metricgrid" style="margin-top:13px"><div class="metric"><strong>'+s.matches+'</strong><span>MATCHES</span></div><div class="metric"><strong>'+s.batInnings+'</strong><span>BATTING INNINGS</span></div><div class="metric"><strong>'+s.runs+'</strong><span>RUNS</span></div><div class="metric"><strong>'+s.wickets+'</strong><span>WICKETS</span></div></div><div class="line"></div><h3>Batting</h3><div class="scrolltable"><table><tbody><tr><th>Balls</th><td>'+s.balls+'</td><th>SR</th><td>'+sr(s.balls,s.runs)+'</td></tr><tr><th>Average</th><td>'+(s.dismissals?(s.runs/s.dismissals).toFixed(2):'—')+'</td><th>Best</th><td>'+s.best+(s.bestNotOut?'*':'')+'</td></tr><tr><th>50s / 100s</th><td>'+s.fifties+' / '+s.hundreds+'</td><th>4s / 6s</th><td>'+s.fours+' / '+s.sixes+'</td></tr><tr><th>Not outs</th><td>'+s.notOuts+'</td><th>Ducks</th><td>'+s.ducks+'</td></tr></tbody></table></div><h3 style="margin-top:12px">Bowling</h3><div class="scrolltable"><table><tbody><tr><th>Overs</th><td>'+ballsText(s.bowlingBalls,6)+'</td><th>Runs</th><td>'+s.conceded+'</td></tr><tr><th>Average</th><td>'+(s.wickets?(s.conceded/s.wickets).toFixed(2):'—')+'</td><th>Economy</th><td>'+economy(s.bowlingBalls,s.conceded,6)+'</td></tr><tr><th>Strike rate</th><td>'+(s.wickets?(s.bowlingBalls/s.wickets).toFixed(2):'—')+'</td><th>Best</th><td>'+s.bestWickets+'/'+s.bestConceded+'</td></tr></tbody></table></div><h3 style="margin-top:12px">Fielding</h3><div class="metricgrid"><div class="metric"><strong>'+s.catches+'</strong><span>CATCHES</span></div><div class="metric"><strong>'+s.runOuts+'</strong><span>RUN OUTS</span></div><div class="metric"><strong>'+s.stumpings+'</strong><span>STUMPINGS</span></div><div class="metric"><strong>'+s.innings+'</strong><span>TEAM INNINGS</span></div></div></section>'}
function metrics(pid){
 const s={matches:0,innings:0,batInnings:0,runs:0,balls:0,dismissals:0,notOuts:0,ducks:0,fours:0,sixes:0,fifties:0,hundreds:0,best:0,bestNotOut:false,wickets:0,bowlingBalls:0,conceded:0,bestWickets:0,bestConceded:Infinity,catches:0,runOuts:0,stumpings:0};
 const seen=new Set();
 for(const m of db.matches){if(m.deleted)continue;let matchPlayed=false;
   for(const inn of m.innings){
     const b=inn.batters&&inn.batters[pid],w=inn.bowlers&&inn.bowlers[pid],f=inn.fielding&&inn.fielding[pid];let inInning=false;
     if(b&&(b.balls>0||b.runs>0||b.out)){inInning=true;s.batInnings++;s.runs+=Number(b.runs)||0;s.balls+=Number(b.balls)||0;s.fours+=Number(b.fours)||0;s.sixes+=Number(b.sixes)||0;if(b.out)s.dismissals++;else s.notOuts++;if(b.runs===0&&b.out)s.ducks++;if(b.runs>=50&&b.runs<100)s.fifties++;if(b.runs>=100)s.hundreds++;if(b.runs>s.best){s.best=b.runs;s.bestNotOut=!b.out}}
     if(w&&(w.balls>0||w.wickets>0||w.runs>0)){inInning=true;s.wickets+=Number(w.wickets)||0;s.bowlingBalls+=Number(w.balls)||0;s.conceded+=Number(w.runs)||0;if(w.wickets>s.bestWickets||(w.wickets===s.bestWickets&&w.runs<s.bestConceded)){s.bestWickets=w.wickets;s.bestConceded=w.runs}}
     if(f){const catches=Number(f.catches)||0,runOuts=Number(f.runOuts)||0,stumpings=Number(f.stumpings)||0;s.catches+=catches;s.runOuts+=runOuts;s.stumpings+=stumpings;if(catches||runOuts||stumpings)inInning=true}
     if(inInning){s.innings++;matchPlayed=true}
   }
   if(matchPlayed)seen.add(m.id)
 }
 s.matches=seen.size;if(s.bestConceded===Infinity)s.bestConceded=0;return s
}

function render(){applyTheme();const root=$('#app');try{root.innerHTML=tab==='score'?scorePage():tab==='teams'?teamsPage():tab==='matches'?matchesPage():tab==='analytics'?analyticsPage():settingsPage();document.querySelectorAll('.nav [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}catch(err){console.error('PitchPlay render error:',err);root.innerHTML='<section class="panel"><div class="empty"><strong>We hit a data issue, not a lost scorecard.</strong>Your saved browser data has been kept. Export a backup, then refresh the app to retry.<p style="margin-top:14px"><button class="btn primary" data-action="reload-app">Refresh PitchPlay</button> <button class="btn" data-action="export">Export backup</button></p></div></section>'}}
function exportBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pitchplay-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importBackup(file){try{const obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.teams)||!Array.isArray(obj.matches))throw Error('This does not look like a PitchPlay backup.');const teamIds=new Set(db.teams.map(t=>t.id));for(const t of obj.teams)if(!teamIds.has(t.id))db.teams.push(t);const matchIds=new Set(db.matches.map(m=>m.id));for(const m of obj.matches)if(!matchIds.has(m.id))db.matches.push(m);db.theme=obj.theme||db.theme;save();render();alert('Backup merged. Existing teams and matches were preserved.')}catch(e){alert('Import failed: '+e.message)}}

function deleteMatch(id){const m=getMatchById(id);if(!m||!confirm('Permanently delete "'+m.name+'" and its ball-by-ball history? Export a backup first if you need it.'))return;db.matches=db.matches.filter(x=>x.id!==id);if(db.currentMatchId===id)db.currentMatchId=null;save();render()}
function printScorecard(){const m=currentMatch();if(!m)return alert('No match selected.');let report='<h1>PitchPlay — Detailed Match Scorebook</h1><div style="font-weight:800;margin-bottom:12px">'+esc(m.name)+' · '+esc(m.format)+' · '+new Date(m.date).toLocaleString()+'</div>';report+='<p style="margin:0 0 5px;font-size:12px"><strong>Teams:</strong> '+esc(teamName(m.teamA))+' vs '+esc(teamName(m.teamB))+'</p><p style="margin:0 0 5px;font-size:12px"><strong>Venue:</strong> '+esc(m.venue||'Not recorded')+' · <strong>Umpires:</strong> '+esc(m.umpires||'Not recorded')+'</p><p style="margin:0 0 16px;font-size:12px"><strong>Status:</strong> '+esc(m.status==='completed'?'Completed':'In progress')+' · <strong>Result:</strong> '+esc(m.result||'Match in progress')+(m.completedAt?' · <strong>Completed:</strong> '+new Date(m.completedAt).toLocaleString():'')+'</p>';report+='<h2 style="font-weight:1000;margin-top:18px">Final result</h2><p style="font-size:16px;font-weight:900">'+esc(m.result||'Match in progress')+'</p>';for(let idx=0;idx<m.innings.length;idx++){const inn=m.innings[idx];report+='<h2 class="prteam" style="--teamcolor:'+esc(color(inn.battingTeamId))+'">Innings '+(idx+1)+' — '+esc(teamName(inn.battingTeamId))+' — '+inn.total+'/'+inn.wickets+' ('+ballsText(inn.balls,m.ballsPerOver)+' overs)</h2>';report+='<p style="font-size:11px;margin:6px 0 10px">Run rate: '+(inn.balls?(inn.total/(inn.balls/m.ballsPerOver)).toFixed(2):'0.00')+' · Extras: '+Object.values(inn.extras||{}).reduce((a,b)=>a+(Number(b)||0),0)+' · '+(inn.declared?'Declared':'Innings '+(inn.complete?'complete':'in progress'))+(inn.target?' · Target '+inn.target:'')+'</p>';report+=inningsReport(inn,m,idx,true)}report+='<h2 style="font-weight:1000;margin-top:22px">Match conclusion</h2><p style="font-size:13px;font-weight:800">'+esc(m.result||'Match still in progress')+'</p><p style="font-size:10px;color:#555;margin-top:20px">Generated by PitchPlay Cricket Score Studio · '+new Date().toLocaleString()+'</p>';$('#printArea').innerHTML=report;window.print()}

async function recover(){try{if(!('indexedDB'in window))return;const req=indexedDB.open('PitchPlayRecovery',1);req.onupgradeneeded=()=>req.result.createObjectStore('snapshots');req.onsuccess=()=>{const d=req.result;const get=d.transaction('snapshots','readonly').objectStore('snapshots').get('latest');get.onsuccess=()=>{const rec=get.result;if(rec&&rec.updated>(db.updated||0)&&confirm('A newer local recovery copy was found. Restore it?')){db=rec.data;save();render()}d.close()}}}catch(e){}}
function reportAppError(message){
 try{
   const status=document.getElementById('saveStatus');if(status)status.textContent='App error · refresh needed';
   const root=document.querySelector('#app');if(root&&!document.getElementById('runtimeError')){
     root.insertAdjacentHTML('afterbegin','<div id="runtimeError" class="runtime-error" role="alert"><strong>PitchPlay ran into an error.</strong><div>'+esc(String(message||'Unknown error'))+'</div><button class="btn small" data-action="reload-app" type="button">Refresh app</button></div>')
   }
 }catch(reportError){console.error('PitchPlay could not display its error message:',reportError)}
}
window.addEventListener('error',event=>{console.error('PitchPlay runtime error:',event.error||event.message);reportAppError(event.message||'Unexpected script error')});
window.addEventListener('unhandledrejection',event=>{console.error('PitchPlay async error:',event.reason);reportAppError(event.reason&&event.reason.message||'Unexpected async error')});
